name: ci
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Actions are pinned to full commit SHAs (tags can be moved); Dependabot github-actions bumps them.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The broker's tests run against a real PostgreSQL (ADR 0020), each test in its own database.
    # Same image, same digest as compose.yaml (scripts/tests/test_postgres_pin.py). Throwaway: it
    # lives for this job on the runner and holds nothing but test data, so the password is not a secret.
    services:
      postgres:
        image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # tests run PR code; keep the job token out of .git/config
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: | # 3.11: oldest supported (package tests); last one listed is the default (pre-commit)
            3.11
            3.12
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: pre-commit (secrets, private info, lint, fmt)
        run: pip install --require-hashes -r .github/ci/requirements.txt && pre-commit run --all-files --show-diff-on-failure
      - name: Terraform validate (each root with .tf files)
        run: |
          for d in $(find infra -name '*.tf' -printf '%h\n' | sort -u); do
            terraform -chdir="$d" init -backend=false -input=false && terraform -chdir="$d" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
          # SHA256 of tflint_linux_amd64.zip from the release's checksums.txt; bump with the version.
          checksums: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
      - name: tflint (bundled Terraform ruleset, .tflint.hcl)
        run: tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - name: Trivy config scan (Terraform, Dockerfiles, Kubernetes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: hadolint
        if: hashFiles('**/*Dockerfile*') != ''
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
      - name: Python tests (each package with a pyproject.toml, on the oldest supported Python)
        # The same script developers run locally (scripts/check.sh), minus pre-commit,
        # which ran above.
        env:
          # The service container above; set, so check.sh starts no container of its own.
          FLEET_TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/postgres
        run: |
          pip install --require-hashes -r .github/ci/requirements.txt
          export UV_PYTHON_DOWNLOADS=never # use setup-python's 3.11; fail loudly if missing
          bash scripts/check.sh tests
      - name: Build images (no push; a registry comes in phase 4, ADR 0014)
        run: |
          docker build -t fleet-worker:ci worker
          docker build -t fleet-broker:ci broker
