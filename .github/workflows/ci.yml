name: ci
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
      - name: pre-commit (secrets, private info, lint, fmt)
        run: pip install pre-commit && pre-commit run --all-files --show-diff-on-failure
      - name: Terraform validate (each root with .tf files)
        run: |
          for d in $(find infra -name '*.tf' -printf '%h\n' | sort -u); do
            terraform -chdir="$d" init -backend=false -input=false && terraform -chdir="$d" validate
          done
      - name: Trivy config scan (Terraform, Dockerfiles, Kubernetes)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: hadolint
        run: |
          for f in $(git ls-files '*Dockerfile*'); do docker run --rm -i hadolint/hadolint < "$f"; done
      - name: Python tests
        run: |
          if [ -f pyproject.toml ]; then pip install uv && uv sync && uv run pytest -q; fi
