version: 2
# Only ecosystems that have manifests: Dependabot fails ("No files found") on an empty directory.
# Add each entry in the phase that creates its manifest.
updates:
  # Provider versions in each root's .terraform.lock.hcl (ADR 0017). CI runs no plan, and a bump can
  # change defaults: merge by hand only after a local `terraform plan` in each root shows "No changes".
  - package-ecosystem: terraform
    directories: [/infra/aws/bootstrap, /infra/aws/fleet, /infra/gcp/fleet]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      terraform: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directories: [/worker, /broker, /killswitch]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # let a fresh release age before a bump is proposed
    groups:
      python: { patterns: ["*"] }
  # CI tools (pre-commit, uv) with hashes: a uv-compiled requirements.txt is pip-compile format, which the
  # pip ecosystem updates (hashes included); the uv ecosystem reads uv.lock / pyproject. Source: GitHub docs,
  # "Dependabot supported ecosystems" (pip row lists pip-compile).
  - package-ecosystem: pip
    directory: /.github/ci
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      ci-tools: { patterns: ["*"] }
    ignore:
      # uv stays in step with the uv image in the Dockerfiles (bumped by hand, together).
      - dependency-name: uv
  # Frozen hook SHAs in .pre-commit-config.yaml (the `# frozen: vX` comment is the tag).
  # Source: GitHub docs, "Dependabot supported ecosystems" (a `pre-commit` row with YAML value pre-commit).
  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      pre-commit-hooks: { patterns: ["*"] }
  - package-ecosystem: docker-compose # image digests in compose files (grafana/otel-lgtm, ADR 0018)
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      compose: { patterns: ["*"] }
  - package-ecosystem: docker # base image digests in each Dockerfile (ADR 0014)
    directories: [/worker, /broker, /killswitch]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      docker: { patterns: ["*"] }
    ignore:
      # Digest bumps only (ADR 0014 amendment). python: no new minor or major, so the image
      # stays on 3.11, the version CI tests.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # uv: no version updates, since .github/ci/requirements.txt pins it
      # separately (hashes; regenerate with the uv pip compile line in its header); bump both by hand.
      - dependency-name: "*astral-sh/uv"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
