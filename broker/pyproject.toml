[project]
name = "fleet-broker"
version = "0.0.1"
description = "Fleet broker: job leases, heartbeats and completion over HTTP"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
]

[project.scripts]
fleet-enqueue = "fleet_broker.enqueue:main"

[dependency-groups]
dev = [
    "fleet-worker",
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette 1.2+ prefers httpx2 in TestClient. Not adopted yet: the worker's HttpBroker
    # is built on httpx (catches httpx.TransportError), and the e2e tests hand it a
    # TestClient, so switching means moving the worker too. No removal date announced.
    # Revisit with an ADR when Starlette drops httpx or the worker migrates.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv.sources]
# the worker package, for end-to-end tests of the real loop against this broker
fleet-worker = { path = "../worker", editable = true }
