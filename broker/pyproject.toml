[project]
name = "fleet-broker"
version = "0.0.1"
description = "Fleet broker: job leases, heartbeats and completion over HTTP"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.165.0",
    "google-auth>=2.40",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Telemetry (ADR 0018): `pip install fleet-broker[otel]`; the image installs it. Without it the
# broker still writes JSON logs, and the metrics calls do nothing.
otel = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
]

[project.scripts]
fleet-enqueue = "fleet_broker.enqueue:main"

[dependency-groups]
dev = [
    "fleet-broker[otel]", # tests cover the telemetry code too
    "fleet-worker",
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette 1.2+ prefers httpx2 in TestClient. Not adopted yet: the worker's HttpBroker
    # is built on httpx (catches httpx.TransportError), and the e2e tests hand it a
    # TestClient, so switching means moving the worker too. No removal date announced.
    # Revisit with an ADR when Starlette drops httpx or the worker migrates.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv.sources]
# the worker package, for end-to-end tests of the real loop against this broker
fleet-worker = { path = "../worker", editable = true }
