# Local stack: PostgreSQL, one broker and N workers (ADR 0014, ADR 0020). Secrets come only from the environment (the vault):
#   ./scripts/with-secrets.ps1 -Names FLEET_WORKER_TOKEN,FLEET_ADMIN_TOKEN,FLEET_DB_PASSWORD -- docker compose up
# FLEET_DB_PASSWORD: generate it into the vault once, as hex (docs/secrets.md).
# Add jobs for the workers' runner (a job no worker can run stays queued, ADR 0015):
#   echo (default):     docker compose run --rm broker fleet-enqueue --demo 20   (echo-v1)
#   FLEET_RUNNER=smoke: docker compose run --rm broker fleet-enqueue --demo 20 --prompt-version smoke-v1
# More workers: docker compose up --scale worker=3
# With Grafana, metrics, logs and traces (ADR 0018): add -f compose.yaml -f compose.obs.yaml (see that file).
# No .env or secrets files: both would put secrets on disk.

services:
  postgres:
    # The job store (ADR 0020). Pinned by digest (the multi-arch index of postgres:18, the major version Cloud SQL uses); Dependabot's docker
    # ecosystem bumps it. No `ports:` on purpose: only the broker, on this Compose network, can reach it.
    image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    environment:
      POSTGRES_USER: fleet
      POSTGRES_DB: fleet
      # Only applies when the data volume is first created (docs/secrets.md). Compose refuses to start without it.
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD:?set FLEET_DB_PASSWORD, e.g. via scripts/with-secrets.ps1}
    volumes:
      # postgres:18+ keeps its version-specific data directory under /var/lib/postgresql (not .../data)
      - postgres-data:/var/lib/postgresql # job store survives restarts and rebuilds
    healthcheck:
      # Over TCP on loopback, inside the container, no password: the image's init phase runs a temporary
      # server on the socket only, so a socket check would pass before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    stop_grace_period: 30s # a clean shutdown checkpoint, not crash recovery on the next start
    # Only this: the image starts as root and drops privileges itself, so cap_drop ALL would break its entrypoint.
    security_opt: ["no-new-privileges:true"]

  broker:
    build: ./broker
    image: fleet-broker:local
    depends_on:
      postgres:
        condition: service_healthy # the broker migrates the schema at startup: the database must be up
    environment:
      # ${VAR:?msg} makes Compose refuse to start when a secret is missing, instead of running without auth.
      FLEET_WORKER_TOKEN: ${FLEET_WORKER_TOKEN:?set FLEET_WORKER_TOKEN, e.g. via scripts/with-secrets.ps1}
      FLEET_ADMIN_TOKEN: ${FLEET_ADMIN_TOKEN:?set FLEET_ADMIN_TOKEN, e.g. via scripts/with-secrets.ps1}
      # Holds the password, so the broker never logs it (ADR 0020). The password is hex: safe in a URL.
      FLEET_DATABASE_URL: postgresql://fleet:${FLEET_DB_PASSWORD:?set FLEET_DB_PASSWORD, e.g. via scripts/with-secrets.ps1}@postgres:5432/fleet
      # Which data classes the worker token may lease (ADR 0015). Config, not a secret; required by the
      # broker. Every local worker is the maintainer's, so all three. Volunteer tokens get `open` only.
      FLEET_WORKER_CLEARANCE: footage,derived,open
      # Not used by the broker itself: lets `docker compose run --rm broker fleet-enqueue` reach the
      # running broker by its service name.
      FLEET_BROKER_URL: http://broker:8000
      FLEET_ALLOW_HTTP: "1" # fleet-enqueue refuses plain http to non-loopback hosts; this private network is the opt-in
    ports:
      - "127.0.0.1:8000:8000" # loopback only: never exposed to the LAN
    healthcheck:
      # python:3.11-slim has no curl; urlopen raises (exit 1) on a refused connection or an error status.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped # back after a crash or a Docker restart; the job store is in postgres-data
    # Hardening: nothing to write to but /tmp, no capabilities, no privilege gain.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  worker:
    build: ./worker
    image: fleet-worker:local
    depends_on:
      broker:
        condition: service_healthy # don't start polling before the broker answers
    environment:
      FLEET_BROKER_URL: http://broker:8000
      # Plain HTTP is acceptable only because this is the private Compose network.
      FLEET_ALLOW_HTTP: "1"
      # The worker token only; the admin token (adding jobs) stays with the broker.
      FLEET_WORKER_TOKEN: ${FLEET_WORKER_TOKEN:?set FLEET_WORKER_TOKEN, e.g. via scripts/with-secrets.ps1}
      # echo (echo-v1 jobs) needs no GPU; smoke (smoke-v1 jobs) asks the model server.
      FLEET_RUNNER: ${FLEET_RUNNER:-echo}
      # The model server (native Ollama on the host GPU) runs outside Docker, see ADR 0014.
      FLEET_MODEL_URL: ${FLEET_MODEL_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Desktop has this name already; Linux Engine needs it
    volumes:
      - results:/results # content-addressed results, shared by every worker replica
    # ADR 0015: the broker only leases jobs this worker declared it can run, so a mismatch can't loop.
    # A runner that crashes on every job still could (each crash burns an attempt on a new lease), so
    # restarts are capped: 3 restarts can't dead-letter any job, then the worker stays down (ADR 0014).
    restart: on-failure:3
    # Time to finish the job in hand after SIGTERM; a longer job is retried when its lease expires.
    stop_grace_period: 30s
    # Hardening: the results volume is the only writable path besides /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    deploy:
      replicas: 1 # docker compose up --scale worker=N for more

volumes:
  postgres-data:
  results:
