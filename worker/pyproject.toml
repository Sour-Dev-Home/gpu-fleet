[project]
name = "fleet-worker"
version = "0.0.1"
description = "Fleet worker: leases jobs from the broker, runs them, uploads content-addressed results"
readme = "README.md"
license = "GPL-3.0-or-later"
# 3.11: oldest Python on the notebook backends (Kaggle, Colab) the worker must run on
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Traces (ADR 0018): `pip install fleet-worker[otel]`; the image installs it. Off unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set too: volunteer workers send nothing by default.
otel = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[project.scripts]
fleet-worker = "fleet_worker.cli:main"

[dependency-groups]
dev = ["fleet-worker[otel]", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
